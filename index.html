<!DOCTYPE html>

<html>
    <head>
        <title>Super Trunfo: MEMES</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Trunfo de Memes</h1>
        <p class="subtitulo">
            Minha coleção de cartas de memes. Passe o mouse sobre uma carta!
        </p>

        <!-- A carta vai aqui -->
        <div class="colecao">
            <div class="carta comum">
                <h2>Para nossa alegria</h2>
                <img src="images/para nossa alegria.png" 
                
                    alt="Imagem retirada de https://www.myinstants.com/pt/instant/para-nossa-alegria/"

                    width="250">

                <p class="raridade">Comum</p>

                <ul class="atributos">
                    <li>Viralidade: 80</li>
                    <li>Zoeira: 70</li>
                    <li>Nostalgia: 90</li>
                </ul>
            </div>

            <div class="carta lendaria">
                <h2>Serjão Berranteiro</h2>
                <img src="images/serjao berranteiro.jpeg" 
                
                    alt="Imagem retirada de https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbeQzHqdtgtMsXvss-CDQRMcGMcfGHDS_MP9k2xPXbJtxB39pnGPhTBYA&s=10"

                    width="250">

                <p class="raridade">Lendária</p>

                <ul class="atributos">
                    <li>Viralidade: 80</li>
                    <li>Zoeira: 70</li>
                    <li>Nostalgia: 90</li>
                </ul>
            </div>
        </div>


    </body>
</html>
